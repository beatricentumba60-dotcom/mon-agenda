name: Construire l’application Android

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dépendances
        run: npm install

      - name: Créer le projet Android
        run: npx cap add android

      - name: Générer les icônes
        run: npx @capacitor/assets generate --android
        continue-on-error: true

      - name: Ajouter les autorisations de rappel
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for P in POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM RECEIVE_BOOT_COMPLETED VIBRATE WAKE_LOCK; do
            grep -q "android.permission.$P\"" "$M" || sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$P\" />\n</manifest>#" "$M"
          done
          cat "$M"

      - name: Synchroniser
        run: npx cap sync android

      - name: Utiliser toujours la même signature (mises à jour sans désinstaller)
        run: |
          mkdir -p ~/.android
          cp signature/debug.keystore ~/.android/debug.keystore

      - name: Construire l’APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renommer
        run: cp android/app/build/outputs/apk/debug/app-debug.apk mon-agenda.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mon-agenda-apk
          path: mon-agenda.apk
